<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Primary redirect method: Meta Refresh -->
    <meta http-equiv="refresh" content="0; url=https://kheiden.com">
    <title>Redirecting...</title>
    
    <!-- Fallback redirect method: JavaScript -->
    <script type="text/javascript">
        window.location.href = "https://kheiden.com";
    </script>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; padding-top: 50px;">
    <!-- Manual fallback for users with JS disabled -->
    <p>Redirecting you to our main site...</p>
    <p>If you are not redirected automatically, please <a href="https://kheiden.com">click here</a>.</p>
</body>
</html>
